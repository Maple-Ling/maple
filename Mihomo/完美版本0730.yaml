proxies:
  - name: "☀️ 直连"
    type: direct
    udp: true
pr: &pr {type: select, proxies: [🌞 代理, 🇯🇵 日本, 🇺🇸 美国, 🇰🇷 韩国, 🇸🇬 新加坡, 🇭🇰 香港, 🇨🇳 台湾, 🇳🇱 荷兰, 🌈 优选, ✨ 反代, ☀️ 直连]}
proxy-groups:
  - {name: 🌞 代理, type: select, proxies: [🇯🇵 日本, 🇺🇸 美国, 🇰🇷 韩国, 🇸🇬 新加坡, 🇭🇰 香港, 🇨🇳 台湾, 🇳🇱 荷兰, 🌈 优选, ✨ 反代, ☀️ 直连]}
  - {name: 🇯🇵 日本, type: select, include-all: true, filter: "(?i)日|jp", exclude-filter: "优选"}
  - {name: 🇺🇸 美国, type: select, include-all: true, filter: "(?i)美|us", exclude-filter: "优选"}
  - {name: 🇰🇷 韩国, type: select, include-all: true, filter: "(?i)韩|kr"}
  - {name: 🇸🇬 新加坡, type: select, include-all: true, filter: "(?i)新|sg"}
  - {name: 🇭🇰 香港, type: select, include-all: true, filter: "(?i)港|hk"}
  - {name: 🇨🇳 台湾, type: select, include-all: true, filter: "(?i)台|tw"}
  - {name: 🇳🇱 荷兰, type: select, include-all: true, filter: "(?i)荷|hl", exclude-filter: "优选"}
  - {name: 🌈 优选, type: select, include-all: true, filter: "(?i)优选", exclude-filter: "反代"}
  - {name: ✨ 反代, type: select, include-all: true, filter: "(?i)反代"}
  - {name: 🌟 Google, !!merge <<: *pr}
  - {name: 💫 ChatGPT, !!merge <<: *pr}
  - {name: 💬 Telegram, !!merge <<: *pr}
  - {name: 🎵 TikTok, !!merge <<: *pr}
  - {name: 🎬 Emby, !!merge <<: *pr}
  - {name: 🐳 容器, !!merge <<: *pr}
  - {name: 🏆 Steam, !!merge <<: *pr}
  - {name: 🎮 腾讯, !!merge <<: *pr}
  - {name: ☀️ 兜底, !!merge <<: *pr}
