port: 8080
socks-port: 1080
mixed-port: 7890
redir-port: 7891
tproxy-port: 7892
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: 0.0.0.0:9090
external-ui-name: zashboard
external-ui: ui
secret: "188271"
allow-lan: true
bind-address: "*"
ipv6: true
mode: rule
unified-delay: true
tcp-concurrent: true
log-level: error
keep-alive-interval: 30
keep-alive-idle: 120
profile: { store-selected: true, store-fake-ip: true }
hosts:
  "fn.maple521.cc.cd": 192.168.1.200
  "fnos.maple521.cc.cd": 192.168.1.200
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
tun:
  enable: false
  stack: mixed
  dns-hijack: [udp://any:53, tcp://any:53]
  auto-detect-interface: false
  auto-route: false
  auto-redirect: false
  strict-route: false
  endpoint-independent-nat: true
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    QUIC: { ports: [443] }
    TLS:  { ports: [443, 8443] }
    HTTP: { ports: [80, 8081-8880] }
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
    - "+.tiktok.com"
    - "play.google.com"
    - "dl.google.com"
    - "clients.google.com"
    - "android.com"
    - "*.googlevideo.com"
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake6-ip-range: fd00::8/56
  fake-ip-filter-mode: blacklist
  fake6-ip-filter-mode: blacklist
  respect-rules: true
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    - "localhost"
    - "*.challenges.cloudflare.com"
    - "*.captcha.cloudflare.com"
    - "*.hcaptcha.com"
    - "*.recaptcha.net"
    - "rule-set:cn_domain,private_domain,rule-direct_domain"
  fake6-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.home.arpa"
    - "localhost"
    - "*.challenges.cloudflare.com"
    - "*.captcha.cloudflare.com"
    - "*.hcaptcha.com"
    - "*.recaptcha.net"
    - "rule-set:cn_domain,private_domain,rule-direct_domain"
  nameserver-policy:
    "+.google.com": https://dns.alidns.com/dns-query
    "+.googleapis.com": https://dns.alidns.com/dns-query
    "+.gstatic.com": https://dns.alidns.com/dns-query
    "+.ggpht.com": https://dns.alidns.com/dns-query
    "+.googlevideo.com": https://dns.alidns.com/dns-query
    "+.googleusercontent.com": https://dns.alidns.com/dns-query
    "+.android.com": https://dns.alidns.com/dns-query
    "+.play.google.com": https://dns.alidns.com/dns-query
    "+.youtube.com": https://dns.alidns.com/dns-query
    "+.clients.google.com": https://dns.alidns.com/dns-query
    "+.ipv6.google.com": https://dns.alidns.com/dns-query
    "rule-set:google_domain": https://dns.alidns.com/dns-query
    "rule-set:youtube_domain": https://dns.alidns.com/dns-query
